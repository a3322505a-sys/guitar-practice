name: Android core
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r scripts/song_package/requirements.txt
      - run: python scripts/test_song_assets.py && python scripts/test_song_packages.py
      - run: chmod +x gradlew && ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug testCompareUnitTest lintCompare assembleCompare assembleRelease :app:compileDebugUnitTestKotlin :app:compileP0Kotlin
      - run: python scripts/audit-native-teaching.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-compare-apk
          path: app/build/outputs/apk/compare/*.apk
