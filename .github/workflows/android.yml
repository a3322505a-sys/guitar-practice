name: Android core
on: [push, pull_request]
concurrency:
  group: android-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r scripts/song_package/requirements.txt
      - run: python scripts/test_song_assets.py && python scripts/test_song_packages.py
      - run: chmod +x gradlew && ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug testCompareUnitTest lintCompare assembleCompare assembleRelease lintStandalone assembleStandalone :app:compileDebugUnitTestKotlin
      - run: python scripts/audit-native-teaching.py
      - run: |
          python scripts/audit-runtime-isolation.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --debug-apk app/build/outputs/apk/debug/app-debug.apk
          python scripts/audit-runtime-isolation.py --apk app/build/outputs/apk/standalone/app-standalone-unsigned.apk
          python scripts/audit-runtime-isolation.py --apk app/build/outputs/apk/compare/app-compare-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          retention-days: 7
          path: app/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk
          retention-days: 7
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-compare-apk
          retention-days: 7
          path: app/build/outputs/apk/compare/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-standalone-apk
          retention-days: 7
          path: app/build/outputs/apk/standalone/*.apk
