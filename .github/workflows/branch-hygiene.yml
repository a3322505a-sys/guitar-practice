name: Branch hygiene

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  prune:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete a merged short-lived branch if unchanged
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const base = context.payload.repository.default_branch;
            if (pr.head.repo.full_name !== owner + '/' + repo) return;
            const branch = pr.head.ref;
            if (!branch || branch === base) return;
            if (!/^(codex|feat|fix|chore|docs|refactor)\//.test(branch)) return;
            let ref;
            try {
              ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + branch });
            } catch (err) {
              if (err.status === 404) return;
              throw err;
            }
            if (ref.data.object.sha !== pr.head.sha) {
              core.info('Skipping moved branch ' + branch);
              return;
            }
            const cmp = await github.rest.repos.compareCommits({ owner, repo, base, head: branch });
            if (cmp.data.ahead_by !== 0) {
              core.info('Skipping branch with unmerged commits ' + branch);
              return;
            }
            await github.rest.git.deleteRef({ owner, repo, ref: 'heads/' + branch });
            core.info('Deleted merged branch ' + branch);
